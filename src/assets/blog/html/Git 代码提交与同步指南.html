<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 代码提交与同步指南</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.8;
      color: #334155;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      color: #0f172a;
      border-bottom: 3px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 22px;
      color: #1e293b;
      margin-top: 32px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }
    pre {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 16px 0;
    }
    code {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 0.9em;
      color: #1e293b;
    }
    .command-group {
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      padding: 16px;
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body>
  <h1>Git 代码提交与同步指南</h1>
  
  <div class="command-group">
    <h2>同步远程代码</h2>
    <pre><code># 克隆远程仓库到本地
git clone 仓库地址

# 拉取远程最新代码（推荐）
git pull

# 拉取但不自动合并
git fetch</code></pre>
  </div>

  <div class="command-group">
    <h2>代码提交与推送</h2>
    <pre><code># 查看文件状态
git status

# 暂存所有修改
git add .

# 添加单个文件
git add 文件名

# 提交代码
git commit -m "修改说明"

# 推送到远程 main 分支
git push</code></pre>
  </div>
</body>
</html>
